name: Deploy ara.kids

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ara-kids-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ara.kids

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Assemble production release
        run: |
          mkdir -p release/api
          cp -R dist/. release/
          cp api/bootstrap.php api/leads.php api/payment-webhook.php release/api/

      - name: Deploy to Hostinger over SFTP
        uses: appleboy/scp-action@v1
        with:
          host: 46.202.172.141
          username: u589531741
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 65002
          source: "release/*"
          target: "/home/u589531741/domains/ara.kids/public_html"
          strip_components: 1
          overwrite: true
          timeout: 60s
          command_timeout: 10m
